name: Daily Internship Job Alert

on:
  schedule:
    # Runs every day at 07:00 UTC (08:00 CET in winter / 09:00 CEST in summer)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual 1-click test run from GitHub UI

permissions:
  contents: write # Required so GitHub Actions can save updated seen_jobs.json back to the repo

jobs:
  send-job-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Alert Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cloud_bot.py

      - name: Save updated seen_jobs.json to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "chore: update seen_jobs.json [skip ci]"
          git push
